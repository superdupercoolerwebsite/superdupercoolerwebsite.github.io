<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>superdupercoolerwebsite</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
  :root { --acc: #8b5cf6; --acc2: #ff5fa2; --ink: #2a2350; --ink2: #1d1746; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; color: #edeff7;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(#140a3a 0%, #241769 30%, #46379f 54%, #7d6fd0 74%, #b9b2ec 88%, #dcd6f6 100%); }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  .pix { font-family: "Pixelify Sans", system-ui, sans-serif; }

  /* fixed space backdrop */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
  .star { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }

  /* home (scrolls over the backdrop) */
  #home { position: absolute; inset: 0; z-index: 1; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; align-items: center; padding: 7vh 16px 60px; }
  #home::-webkit-scrollbar { display: none; }
  .logo { width: min(520px, 88vw); height: auto; image-rendering: pixelated; filter: drop-shadow(0 7px 0 #0000001f) drop-shadow(0 0 34px #ffffff26); }
  .big { width: min(560px, 100%); margin-top: 10px; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 20px; border-radius: 30px; background: #fbfaff; border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink2), 0 16px 34px #160f3a66; }
  .big > svg { color: #6b63a6; width: 22px; height: 22px; flex: none; }
  .big input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-family: "Pixelify Sans", system-ui, sans-serif; font-size: 20px; font-weight: 500; color: var(--ink); }
  .big input::placeholder { color: #8b84b4; }
  .chips { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(760px, 100%); }
  .chip { height: 34px; padding: 0 15px; border-radius: 10px; background: #ffffffcc; border: 2px solid var(--ink); color: var(--ink); font-size: 14px; font-weight: 700; box-shadow: 0 4px 0 #1d174633; }
  .chip.on { color: #fff; background: linear-gradient(135deg, var(--acc), var(--acc2)); }

  .grid { margin-top: 24px; width: min(1040px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; }
  .card { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink2); overflow: hidden; color: #fff; display: grid; place-items: end stretch; transition: transform .12s, box-shadow .12s; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 10px 0 var(--ink2); outline: none; }
  .card .nm { position: relative; z-index: 2; margin: 0; padding: 20px 8px 8px; font-size: 15px; font-weight: 700; text-align: center; text-shadow: 0 2px 0 #0007; background: linear-gradient(transparent, #0000006e); }
  .card .pl { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; opacity: 0; transition: opacity .12s; }
  .card:hover .pl { opacity: 1; }
  .card .pl span { width: 44px; height: 44px; border-radius: 50%; background: #ffffffe6; display: grid; place-items: center; box-shadow: 0 4px 0 #0005; }
  .card .pl span::after { content: ""; margin-left: 3px; border-left: 15px solid var(--ink); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .card .thumb { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: #0003; }
  .empty { grid-column: 1 / -1; text-align: center; color: #e7e2fb; padding: 36px 0; font-size: 15px; }
  #more { margin: 24px auto 0; height: 42px; padding: 0 28px; font-size: 15px; }
  .count { margin: 14px 0 0; color: #e7e2fbcc; font-size: 13px; }

  /* game player */
  #player { position: fixed; inset: 0; z-index: 50; background: #0b0c11; display: none; flex-direction: column; }
  #player.on { display: flex; }
  .pbar { flex: none; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; background: #141021; border-bottom: 2px solid var(--ink); }
  .pbar button { height: 32px; padding: 0 12px; border-radius: 9px; background: #ffffff14; color: #edeff7; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .pbar button:hover { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; }
  .pbar .pname { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #player iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #000; display: block; }

  /* hidden "key": a faint dot bottom-left (also opens with the ` key) */
  #webkey { position: fixed; left: 7px; bottom: 7px; z-index: 40; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; opacity: .07; transition: opacity .2s, transform .2s; }
  #webkey:hover, #webkey:focus-visible { opacity: .55; transform: scale(1.15); outline: none; }

  /* hidden web browser (through the proxy) */
  #web { position: fixed; inset: 0; z-index: 60; background: #0b0c11; display: none; flex-direction: column; }
  #web.on { display: flex; }
  .wbar { flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px; background: #141021; border-bottom: 2px solid var(--ink); }
  .wbar button { height: 32px; padding: 0 11px; border-radius: 9px; background: #ffffff14; color: #edeff7; font-weight: 700; display: flex; align-items: center; gap: 6px; flex: none; }
  .wbar button:hover { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; }
  .wbar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .wbar form { flex: 1; min-width: 0; display: flex; }
  .wbar input { flex: 1; min-width: 0; height: 34px; padding: 0 14px; border-radius: 9px; background: #ffffff10; border: 1px solid #ffffff1f; outline: none; color: #edeff7; font-size: 14px; }
  .wbar input:focus { border-color: var(--acc); background: #ffffff18; }
  .wbar input::placeholder { color: #8b84b4; }
  #wframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #0b0c11; display: block; }

  @media (prefers-reduced-motion: reduce) { .star { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <svg id="sky" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

  <div id="home">
    <img class="logo" src="logo.png" alt="superdupercoolerwebsite">
    <form class="big" id="searchForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search games…" spellcheck="false" autocapitalize="off" enterkeyhint="search"></form>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <button id="more" class="chip pix" hidden>Show more</button>
    <p class="count pix" id="count"></p>
  </div>

  <div id="player">
    <div class="pbar">
      <button id="pback" title="Back to games"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Games</button>
      <span class="pname pix" id="pname"></span>
      <button id="pfull" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
    </div>
    <iframe id="pframe" allow="fullscreen; gamepad; autoplay" title="game"></iframe>
  </div>

  <button id="webkey" title=" " aria-label="open"></button>

  <div id="web">
    <div class="wbar">
      <button id="wback" title="Close"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <form id="wform"><input id="wq" placeholder="Search or type a web address" spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="go"></form>
      <button id="wfull" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <iframe id="wframe" allow="fullscreen; autoplay" title="web"></iframe>
  </div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PAL = [['#8b5cf6', '#ff5fa2'], ['#3b82f6', '#22d3ee'], ['#22c55e', '#a3e635'], ['#f43f5e', '#fb7185'], ['#f59e0b', '#ef4444'], ['#818cf8', '#c084fc'], ['#06b6d4', '#3b82f6'], ['#ec4899', '#8b5cf6']];
const grad = g => { const c = g.colors || PAL[[...g.id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % PAL.length]; return `linear-gradient(135deg, ${c[0]}, ${c[1]})`; };
let GAMES = [], cat = '', list = [], shown = 0;
const PAGE = 120;

const CATS = [['All', ''], ['Racing', 'racing'], ['Arcade', 'arcade runner'], ['Puzzle', 'puzzle'], ['Action', 'shooter action platformer'], ['Sports', 'sports'], ['Chill', 'chill idle clicker adventure casual hypercasual']];

// which games match the typed words (every word must appear somewhere), best first
function search(q) {
  const words = q.toLowerCase().split(/[\s\-_/]+/).filter(Boolean);
  if (!words.length) return GAMES.slice();
  const out = [];
  for (const g of GAMES) {
    const name = g.name.toLowerCase(), all = name + ' ' + g.id + ' ' + (g.tags || '') + ' ' + (g.about || '').toLowerCase();
    let score = 0, ok = true;
    for (const w of words) {
      if (name.startsWith(w)) score += 5; else if (name.includes(w)) score += 3; else if (all.includes(w)) score += 1; else { ok = false; break; }
    }
    if (ok) out.push([score, g]);
  }
  return out.sort((a, b) => b[0] - a[0]).map(e => e[1]);
}
const inCat = g => !cat || cat.split(' ').some(w => (g.tags + ' ' + g.id + ' ' + g.name).toLowerCase().includes(w));

function card(g, eager) {
  const c = document.createElement('button');
  c.className = 'card'; c.title = g.about || g.name;
  c.style.background = grad(g);
  const pic = g.thumb || g.art;
  // if the picture fails to load (slow, blocked), drop it so the colour tile + name shows cleanly
  const img = pic ? `<img class="thumb" loading="${eager ? 'eager' : 'lazy'}" src="${esc(pic)}" alt="" style="object-fit:${g.fit || 'cover'}" onerror="this.remove()">` : '';
  c.innerHTML = `${img}<span class="pl"><span></span></span><p class="nm pix">${esc(g.name)}</p>`;
  c.onclick = () => openGame(g);
  return c;
}
function more() {
  const grid = $('#grid'), slice = list.slice(shown, shown + PAGE);
  slice.forEach((g, i) => grid.appendChild(card(g, shown + i < 30)));
  shown += slice.length;
  $('#more').hidden = shown >= list.length;
  $('#count').textContent = list.length ? `showing ${shown} of ${list.length} games` : '';
}
function fill() {
  list = search($('#q').value).filter(inCat); shown = 0;
  $('#grid').innerHTML = '';
  if (!list.length) { $('#grid').innerHTML = `<div class="empty">No game matches${$('#q').value ? ` “${esc($('#q').value)}”` : ' that'}.</div>`; $('#more').hidden = true; $('#count').textContent = ''; return; }
  more();
}
$('#more').onclick = more;

// ---- the in-site game player ----
// On a filtered network (school, ad-blocker) the game host is blocked, so games are loaded
// through the proxy instead. We test once whether the host is reachable and route accordingly.
let BLOCKED = false;
(function detectBlock() {
  const i = new Image();
  const t = setTimeout(() => { BLOCKED = true; }, 6000);
  i.onload = () => { clearTimeout(t); BLOCKED = false; };
  i.onerror = () => { clearTimeout(t); BLOCKED = true; };
  i.src = 'https://img.gamemonetize.com/osm7ce5njwn43zxsfdfx0y4eluu9cke9/512x384.jpg?b=' + Date.now();
})();
function openGame(g) {
  if (g.newtab && g.url) { window.open(g.url, '_blank', 'noopener'); return; }   // sites that refuse to be framed open in their own tab
  let src = g.url ? g.url : `g/${g.id}/${g.page}`;
  if (g.url && BLOCKED && PROXY) src = PROXY + '/go.html#' + encodeURIComponent(g.url);   // blocked network → go through the proxy
  $('#pframe').src = src;
  $('#pname').textContent = g.name;
  $('#player').classList.add('on');
  requestAnimationFrame(() => $('#pframe').focus());
}
function closeGame() {
  $('#player').classList.remove('on');
  $('#pframe').src = 'about:blank';           // stops the game and its sound
}
$('#pback').onclick = closeGame;
$('#pfull').onclick = () => { const f = $('#pframe'); if (document.fullscreenElement) document.exitFullscreen(); else f.requestFullscreen().then(() => f.focus()).catch(() => {}); };
addEventListener('keydown', e => { if (e.key === 'Escape' && $('#player').classList.contains('on') && !document.fullscreenElement) closeGame(); });

// ---- home controls ----
$('#chips').innerHTML = CATS.map(([n, tg], i) => `<button class="chip${i ? '' : ' on'}" data-t="${tg}">${n}</button>`).join('');
$('#chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.t; for (const o of $('#chips').children) o.classList.toggle('on', o === b); fill(); };
$('#q').oninput = fill;
$('#searchForm').onsubmit = e => { e.preventDefault(); const l = search($('#q').value).filter(inCat); if (l.length) openGame(l[0]); };

// ---- pixel night sky: twinkling stars + a blocky cloud bank ----
function buildSky(svg) {
  const R = (a, b) => a + Math.random() * (b - a);
  let s = '';
  for (let i = 0; i < 80; i++) {
    const sz = Math.random() < 0.14 ? 5 : (Math.random() < 0.5 ? 2 : 3);
    s += `<rect class="star" x="${R(0, 1200) | 0}" y="${R(0, 440) | 0}" width="${sz}" height="${sz}" fill="#fff" style="animation-duration:${R(2, 5).toFixed(2)}s;animation-delay:${R(0, 4).toFixed(2)}s"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = R(60, 1140) | 0, y = R(20, 380) | 0;
    s += `<g class="star" fill="#ffd23f" style="animation-duration:${R(2, 4).toFixed(2)}s;animation-delay:${R(0, 3).toFixed(2)}s"><rect x="${x - 2}" y="${y - 7}" width="4" height="14"/><rect x="${x - 7}" y="${y - 2}" width="14" height="4"/></g>`;
  }
  s += cloudBand(600, 22, '#c3b7ef', R(0, 9));
  s += cloudBand(636, 22, '#ffffff', R(0, 9));
  svg.innerHTML = s;
}
function cloudBand(baseY, step, color, seed) {
  let d = `M0 700 L0 ${baseY}`;
  for (let x = 0; x <= 1200; x += step) {
    const y = baseY - step * Math.round(1.6 + 1.5 * (Math.sin(x / 70 + seed) + 1) + (Math.random() < 0.3 ? 1 : 0));
    d += ` L${x} ${y} L${x + step} ${y}`;
  }
  return `<path d="${d} L1200 700 Z" fill="${color}"/>`;
}
buildSky($('#sky'));

// ---- hidden web browser (through the proxy) ----
let PROXY = '';
fetch('proxy.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(j => { PROXY = (j && j.proxy || '').replace(/\/+$/, ''); }).catch(() => {});
function openWeb(text) {
  const v = (text || '').trim();
  if (!v || !PROXY) return;
  const looksUrl = /^https?:\/\//i.test(v) || (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|:|\?|$)/i.test(v) && !/\s/.test(v));
  const dest = /^https?:\/\//i.test(v) ? v : looksUrl ? 'https://' + v : 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
  $('#wframe').src = PROXY + '/go.html#' + encodeURIComponent(dest);
  $('#web').classList.add('on');
}
function showWeb() { $('#web').classList.add('on'); requestAnimationFrame(() => $('#wq').focus()); }
function closeWeb() { $('#web').classList.remove('on'); $('#wframe').src = 'about:blank'; }
$('#webkey').onclick = showWeb;
$('#wback').onclick = closeWeb;
$('#wform').onsubmit = e => { e.preventDefault(); openWeb($('#wq').value); };
$('#wfull').onclick = () => { const f = $('#wframe'); if (document.fullscreenElement) document.exitFullscreen(); else f.requestFullscreen().then(() => f.focus()).catch(() => {}); };
addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''));
  if (e.key === '`' && !typing) { e.preventDefault(); $('#web').classList.contains('on') ? closeWeb() : showWeb(); }
  if (e.key === 'Escape' && $('#web').classList.contains('on') && !document.fullscreenElement) closeWeb();
});

// ---- load games ----
Promise.all([
  fetch('games.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => []),
  fetch('gm-games.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([mine, more]) => {
  GAMES = mine.concat(more);
  if (!GAMES.length) { $('#grid').innerHTML = '<div class="empty">Could not load the games list.</div>'; return; }
  fill();
});
</script>
</body>
</html>
