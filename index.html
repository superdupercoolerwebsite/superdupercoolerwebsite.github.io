<!doctype html>
<html lang="en">
<head>

<link rel="icon" type="image/png" href="icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
  :root {
    --acc: #8b5cf6; --acc2: #ff5fa2; --glow: #8b5cf655; --ok: #4ade80;
    --bg: #0b0c11; --strip: #15161c; --bar: #2a2c39; --field: #191a22; --panel: #171a24; --panel2: #3a3d4e; --line: #3d4052; --text: #f3f4fa; --dim: #a4a8bd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  ::selection { background: var(--acc); color: #fff; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- tab strip ---- */
  #tabs { flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 8px 12px 0; background: var(--strip); min-height: 46px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 9px; min-width: 120px; max-width: 250px; height: 38px; padding: 0 8px 0 14px; border-radius: 11px 11px 0 0; color: var(--dim); white-space: nowrap; flex: 0 1 250px; position: relative; transition: background .12s, color .12s; }
  .tab:hover:not(.on) { background: #ffffff0f; color: var(--text); }
  .tab.on { background: var(--bar); color: #fff; }
  .tab.on::before, .tab.on::after { content: ""; position: absolute; bottom: 0; width: 10px; height: 10px; pointer-events: none; }
  .tab.on::before { left: -10px; background: radial-gradient(circle at 0 0, transparent 9.5px, var(--bar) 10px); }
  .tab.on::after { right: -10px; background: radial-gradient(circle at 100% 0, transparent 9.5px, var(--bar) 10px); }
  .tab .fav { width: 17px; height: 17px; border-radius: 50%; flex: none; }
  .tab .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; font-size: 13.5px; font-weight: 600; }
  .tab .x { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1; flex: none; }
  .tab .x:hover { background: #ffffff24; }
  .tab .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--acc); animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #newtab { width: 30px; height: 30px; margin: 0 0 4px 10px; border-radius: 50%; color: var(--text); display: grid; place-items: center; flex: none; }
  #newtab:hover { background: #ffffff1a; }

  /* ---- toolbar ---- */
  #bar { flex: none; display: flex; align-items: center; gap: 4px; padding: 7px 12px 8px; background: var(--bar); }
  .ib { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text); flex: none; }
  .ib:hover:not(:disabled) { background: #ffffff1a; }
  .ib:disabled { opacity: .3; cursor: default; }
  #box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 38px; margin: 0 6px; padding: 0 8px 0 12px; border-radius: 19px; background: var(--field); border: 1px solid #ffffff14; transition: border-color .15s, box-shadow .15s; }
  #box > svg { color: var(--dim); }
  #chip:not([hidden]) + svg, #chip:not([hidden]) ~ svg { display: none; }
  #box:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--glow); }
  #chip { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none; background: #4ade801c; color: var(--ok); }
  #chip svg { width: 13px; height: 13px; }
  #chip { user-select: none; }

  #chip.off { background: var(--panel2); color: var(--dim); cursor: default; }
  #chip[hidden] { display: none; }
  #addr { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 14.5px; }
  #addr::placeholder { color: var(--dim); }
  @media (max-width: 560px) { #chip span { display: none; } #chip { padding: 0 6px; } #home, #full { display: none; } }

  #extPanel { position: fixed; top: 96px; right: 12px; z-index: 50; width: min(360px, calc(100vw - 24px)); height: min(520px, calc(100dvh - 120px)); border: 1px solid #ffffff22; border-radius: 12px; background: #292a2d; box-shadow: 0 18px 50px #000b; }
  #extPanel[hidden] { display: none; }

  /* ---- pages ---- */
  #views { flex: 1; min-height: 0; position: relative; background: var(--bg); }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  .view iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  .note { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13px; box-shadow: 0 10px 30px #000a; display: flex; gap: 10px; align-items: center; }
  .note a { color: var(--acc2); font-weight: 700; text-decoration: none; white-space: nowrap; }

  /* ---- new tab page: pixel space ---- */
  .start { height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 9vh 16px 40px; position: relative;
    background: linear-gradient(#3a33c6 0%, #4845d6 20%, #6570ea 46%, #8a93f4 66%, #b3b1f9 84%, #d3cdfc 100%); }
  .sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
  .star { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }
  .start > :not(.sky):not(.buddy) { position: relative; z-index: 1; }
  .logo { width: min(560px, 90vw); height: auto; image-rendering: pixelated; filter: drop-shadow(0 7px 0 #0000001f) drop-shadow(0 0 34px #ffffff26); }
  .big { width: min(560px, 100%); margin-top: 10px; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 20px; border-radius: 30px; background: #fbfaff; border: 3px solid #2a2350; box-shadow: 0 7px 0 #1d1746, 0 16px 34px #160f3a66; }
  .big > svg { color: #6b63a6; width: 22px; height: 22px; }
  .big input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 16px; color: #1c1838; }
  .big input::placeholder { color: #8b84b4; }
  .go { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow: 0 3px 0 #2a2350; transition: transform .1s; }
  .go:hover { transform: translateY(-1px); }
  .go svg { color: #fff; width: 20px; height: 20px; }
  .buddy { position: absolute; left: 16px; bottom: 14px; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 13px; background: #ffffffd9; border: 2px solid #2a235026; color: #2a2350; font-family: "Pixelify Sans", system-ui, sans-serif; font-size: 15px; box-shadow: 0 4px 0 #1d174622; }
  .buddy b { font-weight: 700; } .buddy b.off { color: #b4530a; }
  /* pixel widget cards */
  .widgets { margin-top: 22px; width: min(440px, 100%); display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .wg { min-height: 58px; padding: 7px 9px; border-radius: 11px; background: #fbfaffe6; border: 2px solid #2a2350; box-shadow: 0 4px 0 #1d1746; color: #2a2350; font-family: "Pixelify Sans", system-ui, sans-serif; display: flex; flex-direction: column; gap: 2px; }
  .wg .h { font-size: 9px; letter-spacing: .5px; text-transform: uppercase; opacity: .55; }
  .wg .clock { font-size: 21px; font-weight: 700; line-height: 1; }
  .wg .date { font-size: 10px; opacity: .8; }
  .wg .wrow { display: flex; align-items: center; gap: 6px; }
  .wg .ico { font-size: 17px; line-height: 1; }
  .wg .temp { font-size: 19px; font-weight: 700; line-height: 1; }
  .wg .city { font-size: 10px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wg .city a { color: #7a4bd0; }
  .wg textarea { flex: 1; min-height: 30px; resize: none; border: 0; background: none; outline: none; font: 12px/1.25 "Pixelify Sans", system-ui, sans-serif; color: #2a2350; }
  .wg textarea::placeholder { color: #8b84b4; }
</style>

<body>
<div id="app">
  <div id="tabs"><button id="newtab" title="New tab" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="bar">
    <button class="ib" id="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" id="fwd" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="ib" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button class="ib" id="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
    <form id="box" autocomplete="off">
      <div id="chip" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.500-1-8-4-8-9V6z"/></svg><span></span></div>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="addr" placeholder="Search or enter website" spellcheck="false" autocapitalize="off" enterkeyhint="go">
    </form>
    <button class="ib" id="ext" title="Extensions" aria-label="Extensions"><svg viewBox="0 0 24 24"><path d="M9 4.500a2 2 0 0 1 4 0V6h4a1 1 0 0 1 1 1v4h1.500a2 2 0 0 1 0 4H18v4a1 1 0 0 1-1 1h-4v-1.500a2 2 0 0 0-4 0V20H5a1 1 0 0 1-1-1v-4h1.500a2 2 0 0 0 0-4H4V7a1 1 0 0 1 1-1h4z"/></svg></button>
    <button class="ib" id="real" title="Open this page in a real tab" aria-label="Open in a real tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    <button class="ib" id="full" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="views"></div>
  <iframe id="extPanel" title="Extensions" hidden></iframe>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tabsEl = $('#tabs'), viewsEl = $('#views'), addr = $('#addr'), chip = $('#chip');
const tabs = []; let cur = null, nextId = 1;
const SHORTCUTS = [['Wikipedia', 'https://www.wikipedia.org/'], ['YouTube', 'https://www.youtube.com/'], ['Reddit', 'https://www.reddit.com/'], ['GitHub', 'https://github.com/'], ['Hacker News', 'https://news.ycombinator.com/'], ['Archive', 'https://archive.org/']];
const EXT_PAGE = 'sdcw://extensions';              // the Extensions page, like chrome://extensions
const STORE_PAGE = 'sdcw://store';               // the Extension Store
const isStore = w => w === STORE_PAGE || w.startsWith(STORE_PAGE + '#');
const isExtFile = w => !!PROXY && w.startsWith(PROXY + '/uv/service/~ext/');   // an extension's own page (its options)
const inner = w => w === 'home' || w === EXT_PAGE || isStore(w) || isExtFile(w);
// (Google answers a proxy with a "prove you are human" test, so it cannot be the search engine here.)
const SEARCH = 'https://duckduckgo.com/?q=';     // searches go to DuckDuckGo, through the proxy like every page
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const favOf = u => 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(hostOf(u));
const sameUrl = (a, b) => { try { return new URL(a).href === new URL(b).href; } catch (e) { return a === b; } };

/* ---------- the proxy ----------
   Pages open through a proxy so that almost any site loads inside a tab, shut in a box that asks before every download.
   On this PC the proxy is the local one (port 9200); online, proxy.json says where it is. */
let PROXY = null;
// Once the proxy is found, a hidden page on its address is kept open for the whole visit. It starts the proxy's
// connection once and holds it, so opening a page never has to wait for (or trip over) a restart.
const keepAlive = base => new Promise(res => {
  const k = document.createElement('iframe'); k.hidden = true; k.title = 'Proxy connection'; k.sandbox = 'allow-scripts allow-same-origin';
  const done = e => { if (e && (e.origin !== base || !e.data || e.data.sdcw !== 'ready')) return; removeEventListener('message', done); res(); };
  addEventListener('message', done); setTimeout(() => done(), 7000);
  k.src = base + '/keep.html'; document.body.appendChild(k);
});
const proxyAt = base => fetch(base + '/health').then(r => r.json()).then(j => { if (j.ok) { PROXY = base; return keepAlive(base); } });
const proxyReady = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? proxyAt(`http://${location.hostname}:9200`)
  : fetch('proxy.json').then(r => r.ok ? r.json() : {}).then(j => /^https:\/\/[\w.-]+$/.test(j.proxy || '') ? proxyAt(j.proxy) : 0)).catch(() => {});

// What was typed: a web address, or words to search for.
function toUrl(q) {
  q = q.trim();
  if (!q) return '';
  if (/^https?:\/\//i.test(q)) return q;
  if (/^(sdcw|chrome):\/\/extensions\/?$/i.test(q)) return EXT_PAGE;
  if (/^(sdcw:\/\/store|chrome:\/\/webstore)\/?$/i.test(q)) return STORE_PAGE;
  if (!/\s/.test(q) && /^([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(q)) return 'https://' + q;
  return SEARCH + encodeURIComponent(q);
}

/* ---------- tabs ---------- */
const here = t => t.hist[t.at];
function newTab(where = 'home') {
  const t = { id: nextId++, hist: [], at: -1, title: '', busy: false, view: document.createElement('div'), btn: document.createElement('button') };
  t.view.className = 'view'; viewsEl.appendChild(t.view);
  t.btn.className = 'tab'; t.btn.type = 'button';
  t.btn.onclick = e => { if (e.target.closest('.x')) closeTab(t); else show(t); };
  t.btn.onauxclick = e => { if (e.button === 1) closeTab(t); };
  tabsEl.insertBefore(t.btn, $('#newtab'));
  tabs.push(t); go(t, where); show(t);
  return t;
}
function closeTab(t) {
  const i = tabs.indexOf(t);
  t.view.remove(); t.btn.remove(); tabs.splice(i, 1);
  if (!tabs.length) { newTab(); return; }
  if (cur === t) show(tabs[Math.min(i, tabs.length - 1)]);
}
function show(t) {
  cur = t;
  for (const o of tabs) { o.view.classList.toggle('on', o === t); o.btn.classList.toggle('on', o === t); }
  chrome();
  if (here(t) === 'home') { const i = t.view.querySelector('.big input'); if (i && matchMedia('(pointer: fine)').matches) i.focus(); }
}
function go(t, where, keep) {
  if (!where) return;
  if (!keep) { t.hist.length = t.at + 1; t.hist.push(where); t.at = t.hist.length - 1; }
  t.title = ''; render(t);
  if (t === cur) chrome();
}
function label(t) {
  const w = here(t), home = w === 'home', own = inner(w);
  t.btn.innerHTML = (t.busy ? '<span class="spin"></span>' : `<img class="fav" src="${own ? 'icon.png' : esc(favOf(w))}" alt="" referrerpolicy="no-referrer">`)
    + `<span class="name">${esc(home ? 'New tab' : w === EXT_PAGE ? 'Extensions' : isStore(w) ? 'Extension Store' : isExtFile(w) ? 'Extension page' : t.title || hostOf(w))}</span><span class="x" title="Close tab">&times;</span>`;
}
function render(t) {
  const w = here(t);
  // a tab that already shows a proxied page keeps its wrapper and just points it at the new address (much quicker)
  const live = t.view.querySelector('iframe[data-live]');
  if (live && PROXY && /^https?:\/\//.test(w)) { live.dataset.first = '1'; t.busy = true; label(t); live.contentWindow.postMessage({ sdcw: 'go', url: w }, PROXY); return; }
  t.view.innerHTML = ''; t.busy = false;
  if (w === 'home') { t.view.appendChild(startPage(t)); label(t); return; }

  const f = document.createElement('iframe');
  f.allow = 'fullscreen; autoplay';
  f.referrerPolicy = 'no-referrer';
  t.view.appendChild(f); t.busy = true; label(t);
  f.addEventListener('load', () => { t.busy = false; label(t); });
  proxyReady.then(() => {
    if (here(t) !== w || !f.isConnected) return;
    if (w === EXT_PAGE || isStore(w) || isExtFile(w)) {
      if (!PROXY) { f.remove(); t.busy = false; label(t); const n = document.createElement('div'); n.className = 'note'; n.textContent = 'Extensions need the proxy, and it is offline right now.'; t.view.appendChild(n); return; }
      f.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
      f.src = w === EXT_PAGE ? PROXY + '/ext/boot.html' : isStore(w) ? PROXY + '/ext/boot.html?to=store' + w.slice(STORE_PAGE.length) : w;
    } else if (PROXY) {
      // scripts, forms and downloads (each one asked first) work; no camera/mic/location, no taking over this window
      f.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
      f.dataset.proxied = '1'; f.dataset.first = '1';
      f.src = PROXY + '/go.html#' + encodeURIComponent(w);
    } else {
      // The proxy is always on: nothing is loaded without it. If it cannot be reached, say so instead.
      f.remove(); t.busy = false; label(t);
      const n = document.createElement('div'); n.className = 'note';
      n.innerHTML = '<span>The proxy cannot be reached right now, and pages only open through it.</span><a href="#">Try again</a>';
      n.querySelector('a').onclick = e => { e.preventDefault(); location.reload(); };
      t.view.appendChild(n);
    }
    if (t === cur) chrome();
  });
}
// the proxied page reports where it really is, so the address bar, tab and Back button follow it
addEventListener('message', e => {
  if (!PROXY || e.origin !== PROXY || !e.data) return;
  if (e.data.sdcwPanel === 'close') { $('#extPanel').hidden = true; return; }
  if (e.data.sdcw === 'open') {                    // an extension, or the Extensions page, asks for a new tab
    const u = String(e.data.url || '');
    $('#extPanel').hidden = true;
    const at = tabs.find(o => u === EXT_PAGE ? here(o) === EXT_PAGE : isStore(u) && isStore(here(o)));      // one Extensions tab, one Store tab
    if (at) { show(at); if (u !== here(at)) go(at, u); }
    else if (u === EXT_PAGE || isStore(u) || isExtFile(u) || /^https?:\/\//.test(u)) newTab(u);
    return;
  }
  if (e.data.sdcw === 'back') {                    // a finished download question returns the tab to the page before it
    const t = tabs.find(o => { const f = o.view.querySelector('iframe[data-proxied]'); return f && f.contentWindow === e.source; });
    if (t) { if (t.at > 0) { t.at--; go(t, here(t), true); } else go(t, 'home'); }
    return;
  }
  if (e.data.sdcw !== 'nav' || !/^https?:\/\//.test(e.data.url)) return;
  const t = tabs.find(o => { const f = o.view.querySelector('iframe[data-proxied]'); return f && f.contentWindow === e.source; });
  if (!t) return;
  const f = t.view.querySelector('iframe[data-proxied]'), url = e.data.url;
  f.dataset.live = '1';                        // its wrapper is up and can be asked to show other addresses
  if (f.dataset.first) { delete f.dataset.first; f.dataset.t0 = Date.now(); t.hist[t.at] = url; }
  else if (e.data.auto || Date.now() - f.dataset.t0 < 2500) t.hist[t.at] = url;        // an instant hop is a redirect, not a new page (keeps Back from bouncing)
  else if (!sameUrl(here(t), url)) { t.hist.length = t.at + 1; t.hist.push(url); t.at = t.hist.length - 1; }
  t.title = e.data.title || ''; t.busy = false; label(t);
  if (t === cur) chrome();
});
function chrome() {
  if (!cur) return;
  const w = here(cur), home = w === 'home', own = inner(w);
  if (document.activeElement !== addr) addr.value = home ? '' : isStore(w) ? STORE_PAGE : w;
  $('#back').disabled = cur.at <= 0;
  $('#fwd').disabled = cur.at >= cur.hist.length - 1;
  $('#reload').disabled = home; $('#real').disabled = own;
  chip.hidden = own;
  chip.classList.toggle('off', !PROXY);
  chip.querySelector('span').textContent = PROXY ? 'Protected' : 'Proxy offline';
  chip.title = PROXY ? 'Opened through the proxy. Downloads ask first. Avoid typing passwords for important accounts here.' : 'The proxy cannot be reached, so pages cannot open.';
  document.title = (home ? '' : (w === EXT_PAGE ? 'Extensions' : isStore(w) ? 'Extension Store' : cur.title || hostOf(w)) + ' - ') + 'superdupercoolerwebsite';
}

/* ---------- new tab page ---------- */
function startPage(t) {
  const el = document.createElement('div'); el.className = 'start';
  el.innerHTML = `<svg class="sky" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <img class="logo" src="logo.png" alt="superdupercoolerwebsite">
    <form class="big"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Search the web…" spellcheck="false" autocapitalize="off" enterkeyhint="go"><button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button></form>
    <div class="widgets"></div>
    <div class="buddy">😎 <b>Stay cool</b></div>`;
  buildSky(el.querySelector('.sky'));
  buildWidgets(el.querySelector('.widgets'));
  el.querySelector('form').onsubmit = e => { e.preventDefault(); go(t, toUrl(el.querySelector('input').value)); };
  proxyReady.then(() => {
    const b = el.querySelector('.buddy');
    if (!b) return;
    b.innerHTML = PROXY ? '😎 <b>Protected</b>' : '😎 <b class="off">Proxy offline</b>';
    b.title = PROXY ? 'Pages open through the proxy. Downloads ask first.' : 'The proxy cannot be reached, so pages cannot open right now.';
  });
  return el;
}

// the pixel widget row under the search bar: clock, weather, note
function buildWidgets(w) {
  w.innerHTML = `
    <div class="wg"><div class="h">Time</div><div class="clock">--:--</div><div class="date"></div></div>
    <div class="wg wgWx"><div class="h">Weather</div><div class="wrow"><span class="ico">⏳</span><span class="temp">—</span></div><div class="city">Locating…</div></div>
    <div class="wg"><div class="h">Note</div><textarea placeholder="jot something…" maxlength="160" spellcheck="false"></textarea></div>`;
  // clock (stops itself once the home tab is replaced)
  const cl = w.querySelector('.clock'), dt = w.querySelector('.date');
  const paint = () => {
    const d = new Date();
    cl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    dt.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  };
  paint();
  const iv = setInterval(() => { if (!w.isConnected) return clearInterval(iv); paint(); }, 1000);
  // note, saved on this device
  const ta = w.querySelector('textarea');
  try { ta.value = localStorage.getItem('sdcw.note') || ''; } catch (e) {}
  ta.oninput = () => { try { localStorage.setItem('sdcw.note', ta.value); } catch (e) {} };
  loadWeather(w.querySelector('.wgWx'));
}
// no API key: approximate location from the IP, then Open-Meteo for the current conditions
async function loadWeather(card) {
  const ico = card.querySelector('.ico'), temp = card.querySelector('.temp'), city = card.querySelector('.city');
  const icon = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
  ico.textContent = '⏳'; temp.textContent = '—'; city.textContent = 'Locating…';
  try {
    const g = await fetch('https://ipapi.co/json/').then(r => r.ok ? r.json() : Promise.reject());
    const j = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,weather_code`).then(r => r.ok ? r.json() : Promise.reject());
    const cu = j.current;
    ico.textContent = icon(cu.weather_code);
    temp.textContent = Math.round(cu.temperature_2m) + '°';
    city.textContent = g.city || g.region || '';
  } catch (e) {
    ico.textContent = '📡'; temp.textContent = '—';
    city.innerHTML = '<a href="#">offline — retry</a>';
    city.querySelector('a').onclick = ev => { ev.preventDefault(); loadWeather(card); };
  }
}
// draws the pixel sky: dots, four-point sparkles (white, gold, pink) and fluffy pixel clouds along the bottom
function buildSky(svg) {
  const R = (a, b) => a + Math.random() * (b - a);
  const tw = () => `style="animation-duration:${R(2, 5).toFixed(2)}s;animation-delay:${R(0, 4).toFixed(2)}s"`;
  let s = '';
  for (let i = 0; i < 70; i++) {
    const sz = Math.random() < 0.5 ? 2 : 3, c = Math.random() < 0.18 ? '#ffb3ee' : Math.random() < 0.2 ? '#bfe3ff' : '#fff';
    s += `<rect class="star" x="${R(0, 1200) | 0}" y="${R(150, 560) | 0}" width="${sz}" height="${sz}" fill="${c}" ${tw()}/>`;
  }
  const spark = (x, y, arm, t, c) => `<g class="star" fill="${c}" ${tw()}><rect x="${x - t / 2}" y="${y - arm}" width="${t}" height="${arm * 2}"/><rect x="${x - arm}" y="${y - t / 2}" width="${arm * 2}" height="${t}"/><rect x="${x - t}" y="${y - t}" width="${t * 2}" height="${t * 2}"/></g>`;
  for (let i = 0; i < 12; i++) { const big = Math.random() < 0.3; s += spark(R(30, 1170) | 0, R(165, 520) | 0, big ? 11 : 6, big ? 4 : 2, '#fff'); }
  for (let i = 0; i < 8; i++) { const big = Math.random() < 0.4; s += spark(R(40, 1160) | 0, R(170, 540) | 0, big ? 11 : 7, big ? 4 : 2, '#ffd23f'); }
  for (let i = 0; i < 7; i++) s += spark(R(30, 1170) | 0, R(180, 560) | 0, 5, 2, '#ff9be6');
  s += cloudBank('#a9a8f3', 640, 125) + cloudBank('#cdc9fb', 664, 100) + cloudBank('#f7f5ff', 688, 78);
  svg.innerHTML = s;
}
// one layer of puffy clouds as a single stepped (pixel) outline: piled higher at both sides, low in the middle
function cloudBank(color, baseY, rise) {
  const S = 5, puffs = [];
  for (let x = -60; x <= 1260; x += 36 + Math.random() * 42) {
    const edge = Math.abs(x - 600) / 600, r = 30 + Math.random() * 34 + edge * 14;
    const y = baseY - rise * Math.pow(edge, 1.5) + (Math.random() - 0.5) * 34;
    puffs.push([x, y, r]);
    if (Math.random() < 0.55) puffs.push([x + (Math.random() - 0.5) * 40, y - r * 0.7, r * 0.6]);
  }
  let d = 'M0 700';
  for (let x = 0; x < 1200; x += S) {
    let top = 700;
    for (const [cx, cy, r] of puffs) { const dx = x + S / 2 - cx; if (Math.abs(dx) < r) top = Math.min(top, cy - Math.sqrt(r * r - dx * dx)); }
    top = Math.min(700, Math.round(top / S) * S);
    d += `L${x} ${top}L${x + S} ${top}`;
  }
  return `<path d="${d}L1200 700Z" fill="${color}"/>`;
}

/* ---------- toolbar ---------- */
$('#newtab').onclick = () => newTab();

$('#back').onclick = () => { if (cur.at > 0) { cur.at--; go(cur, here(cur), true); } };
$('#fwd').onclick = () => { if (cur.at < cur.hist.length - 1) { cur.at++; go(cur, here(cur), true); } };
$('#reload').onclick = () => go(cur, here(cur), true);
$('#home').onclick = () => go(cur, 'home');
$('#real').onclick = () => { const w = here(cur); if (!inner(w)) window.open(w, '_blank', 'noopener,noreferrer'); };
// the puzzle button: a small window listing the extensions (it lives on the proxy's address, where they are stored)
$('#ext').onclick = async () => {
  const p = $('#extPanel');
  if (!p.hidden) { p.hidden = true; return; }
  await proxyReady;
  if (!PROXY) { newTab(EXT_PAGE); return; }
  if (!p.src) { p.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups'; p.src = PROXY + '/ext/panel.html'; } else p.contentWindow.postMessage({ sdcwPanel: 'show' }, PROXY);
  p.hidden = false;
};
addEventListener('pointerdown', e => { if (!e.target.closest('#ext')) $('#extPanel').hidden = true; });
$('#full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
$('#box').onsubmit = e => { e.preventDefault(); const u = toUrl(addr.value); if (u) { addr.blur(); go(cur, u); } };
addr.onfocus = () => addr.select();
addr.onblur = () => chrome();
addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('#back').click(); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $('#fwd').click(); }
  else if (e.key === 'Escape' && document.activeElement === addr) addr.blur();
});

window.SDCW = { tabs, go, newTab, toUrl, proxyReady, get cur() { return cur; }, get PROXY() { return PROXY; } };   // for testing
const first = new URLSearchParams(location.search).get('q');
newTab(first ? toUrl(first) : 'home');
if (first) history.replaceState(null, '', location.pathname);
proxyReady.then(() => chrome());       // the chip can only say "Protected" once the proxy has been found
</script>
