<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>superdupercoolerwebsite</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --acc: #8b5cf6; --acc2: #ff5fa2; --glow: #8b5cf655; --ok: #4ade80;
    --bg: #0b0c11; --bar: #12131b; --panel: #171a24; --panel2: #1e2130; --line: #272b3d; --text: #edeff7; --dim: #888fa6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  ::selection { background: var(--acc); color: #fff; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- tab strip ---- */
  #tabs { flex: none; display: flex; align-items: flex-end; gap: 3px; padding: 7px 8px 0; background: #0c0d13; min-height: 43px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 8px; min-width: 110px; max-width: 220px; height: 36px; padding: 0 6px 0 12px; border-radius: 11px 11px 0 0; color: var(--dim); white-space: nowrap; flex: 0 1 220px; position: relative; transition: background .15s, color .15s; }
  .tab:hover { background: #171925; color: var(--text); }
  .tab.on { background: var(--bar); color: var(--text); }
  .tab.on::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--acc), var(--acc2)); box-shadow: 0 0 10px var(--glow); }
  .tab .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; }
  .tab .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; font-size: 13px; }
  .tab .x { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 16px; line-height: 1; flex: none; }
  .tab .x:hover { background: var(--line); }
  .tab .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--acc); animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #newtab { width: 32px; height: 32px; margin: 0 0 3px 2px; border-radius: 9px; color: var(--dim); display: grid; place-items: center; flex: none; }
  #newtab:hover { background: var(--panel2); color: var(--text); }

  /* ---- toolbar ---- */
  #bar { flex: none; display: flex; align-items: center; gap: 4px; padding: 7px 10px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .ib { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); flex: none; }
  .ib:hover:not(:disabled) { background: var(--panel2); color: var(--text); }
  .ib:disabled { opacity: .3; cursor: default; }
  #box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; margin: 0 4px; padding: 0 6px 0 6px; border-radius: 18px; background: #0b0c11; border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  #box:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--glow); }
  #chip { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none; background: #4ade801c; color: var(--ok); }
  #chip svg { width: 13px; height: 13px; }
  #chip.off { background: var(--panel2); color: var(--dim); }
  #chip[hidden] { display: none; }
  #addr { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 14px; }
  #addr::placeholder { color: var(--dim); }
  @media (max-width: 560px) { #chip span { display: none; } #chip { padding: 0 6px; } #home, #full { display: none; } }

  /* ---- pages ---- */
  #views { flex: 1; min-height: 0; position: relative; background: var(--bg); }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  .view iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  .note { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13px; box-shadow: 0 10px 30px #000a; display: flex; gap: 10px; align-items: center; }
  .note a { color: var(--acc2); font-weight: 700; text-decoration: none; white-space: nowrap; }

  /* ---- new tab page ---- */
  .start { height: 100%; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; align-items: center; padding: 7vh 16px 40px; position: relative; }
  .start::-webkit-scrollbar { display: none; }
  .start::before { content: ""; position: absolute; top: -10%; left: 50%; width: min(900px, 120%); height: 460px; transform: translateX(-50%); background: radial-gradient(closest-side, #8b5cf633, transparent); pointer-events: none; }
  .start > * { position: relative; }
  .logo { width: min(500px, 84vw); height: auto; image-rendering: pixelated; filter: drop-shadow(0 0 28px #8b5cf644); }
  .tag { margin: 4px 0 22px; color: var(--dim); }
  .big { width: min(620px, 100%); display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 18px; border-radius: 27px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  .big:focus-within { border-color: var(--acc); box-shadow: 0 0 0 4px var(--glow), 0 12px 40px #0008; }
  .big svg { color: var(--dim); }
  .big input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 16px; }
  .tiles { margin-top: 30px; width: min(620px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 12px; transition: transform .12s, border-color .12s, box-shadow .12s; }
  .tile:hover { transform: translateY(-3px); border-color: var(--acc); box-shadow: 0 0 22px var(--glow); }
  .tile img { width: 34px; height: 34px; border-radius: 9px; background: #fff; padding: 4px; }
  .status { margin-top: 26px; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; text-align: center; }
  .status b { color: var(--ok); } .status b.off { color: #fbbf24; }
</style>
</head>
<body>
<div id="app">
  <div id="tabs"><button id="newtab" title="New tab" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="bar">
    <button class="ib" id="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" id="fwd" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="ib" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button class="ib" id="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
    <form id="box" autocomplete="off">
      <div id="chip" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.500-1-8-4-8-9V6z"/></svg><span></span></div>
      <input id="addr" placeholder="Search or type a web address" spellcheck="false" autocapitalize="off" enterkeyhint="go">
    </form>
    <button class="ib" id="real" title="Open this page in a real tab" aria-label="Open in a real tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    <button class="ib" id="full" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="views"></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tabsEl = $('#tabs'), viewsEl = $('#views'), addr = $('#addr'), chip = $('#chip');
const tabs = []; let cur = null, nextId = 1;
const SHORTCUTS = [['Wikipedia', 'https://www.wikipedia.org/'], ['YouTube', 'https://www.youtube.com/'], ['Reddit', 'https://www.reddit.com/'], ['GitHub', 'https://github.com/'], ['Hacker News', 'https://news.ycombinator.com/'], ['Archive', 'https://archive.org/']];
const SEARCH = 'https://duckduckgo.com/?q=';      // Google answers a proxy with a "prove you are human" test
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const favOf = u => 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(hostOf(u));
const sameUrl = (a, b) => { try { return new URL(a).href === new URL(b).href; } catch (e) { return a === b; } };

/* ---------- the proxy ----------
   Pages open through a proxy so that almost any site loads inside a tab, shut in a box that cannot download files.
   On this PC the proxy is the local one (port 9200); online, proxy.json says where it is. */
let PROXY = null;
const proxyAt = base => fetch(base + '/health').then(r => r.json()).then(j => { if (j.ok) PROXY = base; });
const proxyReady = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? proxyAt(`http://${location.hostname}:9200`)
  : fetch('proxy.json').then(r => r.ok ? r.json() : {}).then(j => /^https:\/\/[\w.-]+$/.test(j.proxy || '') ? proxyAt(j.proxy) : 0)).catch(() => {});

// What was typed: a web address, or words to search for.
function toUrl(q) {
  q = q.trim();
  if (!q) return '';
  if (/^https?:\/\//i.test(q)) return q;
  if (!/\s/.test(q) && /^([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(q)) return 'https://' + q;
  return SEARCH + encodeURIComponent(q);
}

/* ---------- tabs ---------- */
const here = t => t.hist[t.at];
function newTab(where = 'home') {
  const t = { id: nextId++, hist: [], at: -1, title: '', busy: false, view: document.createElement('div'), btn: document.createElement('button') };
  t.view.className = 'view'; viewsEl.appendChild(t.view);
  t.btn.className = 'tab'; t.btn.type = 'button';
  t.btn.onclick = e => { if (e.target.closest('.x')) closeTab(t); else show(t); };
  t.btn.onauxclick = e => { if (e.button === 1) closeTab(t); };
  tabsEl.insertBefore(t.btn, $('#newtab'));
  tabs.push(t); go(t, where); show(t);
  return t;
}
function closeTab(t) {
  const i = tabs.indexOf(t);
  t.view.remove(); t.btn.remove(); tabs.splice(i, 1);
  if (!tabs.length) { newTab(); return; }
  if (cur === t) show(tabs[Math.min(i, tabs.length - 1)]);
}
function show(t) {
  cur = t;
  for (const o of tabs) { o.view.classList.toggle('on', o === t); o.btn.classList.toggle('on', o === t); }
  chrome();
  if (here(t) === 'home') { const i = t.view.querySelector('.big input'); if (i && matchMedia('(pointer: fine)').matches) i.focus(); }
}
function go(t, where, keep) {
  if (!where) return;
  if (!keep) { t.hist.length = t.at + 1; t.hist.push(where); t.at = t.hist.length - 1; }
  t.title = ''; render(t);
  if (t === cur) chrome();
}
function label(t) {
  const w = here(t), home = w === 'home';
  t.btn.innerHTML = (t.busy ? '<span class="spin"></span>' : `<img class="fav" src="${home ? 'icon.png' : esc(favOf(w))}" alt="" referrerpolicy="no-referrer">`)
    + `<span class="name">${esc(home ? 'New tab' : t.title || hostOf(w))}</span><span class="x" title="Close tab">&times;</span>`;
}
function render(t) {
  const w = here(t);
  t.view.innerHTML = ''; t.busy = false;
  if (w === 'home') { t.view.appendChild(startPage(t)); label(t); return; }
  const f = document.createElement('iframe');
  f.allow = 'fullscreen; autoplay';
  f.referrerPolicy = 'no-referrer';
  t.view.appendChild(f); t.busy = true; label(t);
  f.addEventListener('load', () => { t.busy = false; label(t); });
  proxyReady.then(() => {
    if (here(t) !== w || !f.isConnected) return;
    if (PROXY) {
      // scripts and forms work; no downloads, no camera/mic/location, no taking over this window
      f.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
      f.dataset.proxied = '1'; f.dataset.first = '1';
      f.src = PROXY + '/go.html#' + encodeURIComponent(w);
    } else {
      // no proxy reachable: try the site directly. Many sites refuse to be shown inside another page.
      f.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
      f.src = w;
      const n = document.createElement('div'); n.className = 'note';
      n.innerHTML = `<span>The proxy is offline, so some sites stay blank.</span><a href="${esc(w)}" target="_blank" rel="noopener noreferrer">Open in a real tab</a>`;
      t.view.appendChild(n);
    }
    if (t === cur) chrome();
  });
}
// the proxied page reports where it really is, so the address bar, tab and Back button follow it
addEventListener('message', e => {
  if (!PROXY || e.origin !== PROXY || !e.data || e.data.sdcw !== 'nav' || !/^https?:\/\//.test(e.data.url)) return;
  const t = tabs.find(o => { const f = o.view.querySelector('iframe[data-proxied]'); return f && f.contentWindow === e.source; });
  if (!t) return;
  const f = t.view.querySelector('iframe[data-proxied]'), url = e.data.url;
  if (f.dataset.first) { delete f.dataset.first; f.dataset.t0 = Date.now(); t.hist[t.at] = url; }
  else if (Date.now() - f.dataset.t0 < 2500) t.hist[t.at] = url;        // an instant hop is a redirect, not a new page (keeps Back from bouncing)
  else if (!sameUrl(here(t), url)) { t.hist.length = t.at + 1; t.hist.push(url); t.at = t.hist.length - 1; }
  t.title = e.data.title || ''; t.busy = false; label(t);
  if (t === cur) chrome();
});
function chrome() {
  if (!cur) return;
  const w = here(cur), home = w === 'home';
  if (document.activeElement !== addr) addr.value = home ? '' : w;
  $('#back').disabled = cur.at <= 0;
  $('#fwd').disabled = cur.at >= cur.hist.length - 1;
  $('#reload').disabled = home; $('#real').disabled = home;
  chip.hidden = home;
  chip.classList.toggle('off', !PROXY);
  chip.querySelector('span').textContent = PROXY ? 'Protected' : 'Direct';
  chip.title = PROXY ? 'Opened through the proxy. Downloads are blocked. Avoid typing passwords for important accounts here.' : 'The proxy is offline, so this page is loaded directly.';
  document.title = (home ? '' : (cur.title || hostOf(w)) + ' - ') + 'superdupercoolerwebsite';
}

/* ---------- new tab page ---------- */
function startPage(t) {
  const el = document.createElement('div'); el.className = 'start';
  el.innerHTML = `<img class="logo" src="logo.png" alt="superdupercoolerwebsite">
    <div class="tag">A browser inside your browser.</div>
    <form class="big"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg><input placeholder="Search or type a web address" spellcheck="false" autocapitalize="off" enterkeyhint="go"></form>
    <div class="tiles">${SHORTCUTS.map(([n, u]) => `<button class="tile" type="button" data-u="${esc(u)}"><img src="${esc(favOf(u))}" alt="" referrerpolicy="no-referrer">${esc(n)}</button>`).join('')}</div>
    <div class="status"></div>`;
  el.querySelector('form').onsubmit = e => { e.preventDefault(); go(t, toUrl(el.querySelector('input').value)); };
  el.querySelector('.tiles').onclick = e => { const b = e.target.closest('.tile'); if (b) go(t, b.dataset.u); };
  proxyReady.then(() => {
    el.querySelector('.status').innerHTML = PROXY
      ? '<b>&#9679; Protected</b> Pages open through the proxy. Downloads are blocked.'
      : '<b class="off">&#9679; Proxy offline</b> Pages load directly, and many sites will stay blank.';
  });
  return el;
}

/* ---------- toolbar ---------- */
$('#newtab').onclick = () => newTab();
$('#back').onclick = () => { if (cur.at > 0) { cur.at--; go(cur, here(cur), true); } };
$('#fwd').onclick = () => { if (cur.at < cur.hist.length - 1) { cur.at++; go(cur, here(cur), true); } };
$('#reload').onclick = () => go(cur, here(cur), true);
$('#home').onclick = () => go(cur, 'home');
$('#real').onclick = () => { const w = here(cur); if (w !== 'home') window.open(w, '_blank', 'noopener,noreferrer'); };
$('#full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
$('#box').onsubmit = e => { e.preventDefault(); const u = toUrl(addr.value); if (u) { addr.blur(); go(cur, u); } };
addr.onfocus = () => addr.select();
addr.onblur = () => chrome();
addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('#back').click(); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $('#fwd').click(); }
  else if (e.key === 'Escape' && document.activeElement === addr) addr.blur();
});

window.SDCW = { tabs, go, newTab, toUrl, proxyReady, get cur() { return cur; }, get PROXY() { return PROXY; } };   // for testing
const first = new URLSearchParams(location.search).get('q');
newTab(first ? toUrl(first) : 'home');
if (first) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
