  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <!-- the handle, with a dark shadow copy under it -->
  <path d="M158 162 L204 208" stroke="#1a1440" stroke-opacity="0.35" stroke-width="30" stroke-linecap="round" transform="translate(0 6)"/>
  <path d="M158 162 L204 208" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
